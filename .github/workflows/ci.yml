name: Tenon CI (macOS ARM64 & Linux x86_64)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-and-test:
    name: Build, Verify, Stdlib, LSP & Stage-3 Bootstrap (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Z3 & LLVM/Clang (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y z3 clang llvm libsqlite3-dev libssl-dev libcurl4-openssl-dev

      - name: Install Z3 & LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install z3 llvm

      - name: Run full Cargo workspace tests
        run: cargo test --workspace

      - name: Build release tenon binary
        run: cargo build --release --bin tenon

      - name: Verify Tenon stdlib suites (nn, ui, gpu, sync, net, db, web_app)
        run: |
          ./target/release/tenon test std/nn/nn_test.tn
          ./target/release/tenon test std/ui/gpui_app_test.tn
          ./target/release/tenon test std/gpu/tensor_test.tn
          ./target/release/tenon test std/sync
          ./target/release/tenon test examples/web_app

      - name: Verify compile-time shape bug rejection (Tenon-Torch negative control)
        run: |
          if ./target/release/tenon check examples/showcase/bad_nn_shape.tn; then
            echo "ERROR: expected bad_nn_shape.tn to be rejected at compile time!"
            exit 1
          fi

      - name: Verify Stage-3 -> Stage-4 Bit-Exact Fixed-Point Self-Hosting Bootstrap (0% Rust)
        run: ./examples/bootstrap/stage3/verify_fixed_point.sh

      - name: Verify VS Code extension & live LSP 1.5 protocol tests
        run: |
          cd editors/vscode
          npm test

      - name: Verify zero-Rust portable C-ABI GPU & Window shims compile cleanly
        run: |
          clang -O2 -Wall -Wextra -c std/gpu/vulkan/vulkan_shim.c -o /tmp/vulkan_shim.o
          clang -O2 -Wall -Wextra -c std/gpu/window/glfw_vulkan_window.c -o /tmp/glfw_win.o
          rm -f /tmp/vulkan_shim.o /tmp/glfw_win.o
