[workspace]
resolver = "2"
members = [
    "crates/tenon-syntax",
    "crates/tenon-verify",
    "crates/tenon-codegen",
    "crates/tenon-dist",
    "crates/tenon-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
rusqlite = { version = "0.37", features = ["bundled"] }
tokio = { version = "1.45", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "signal", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
cranelift-codegen = "0.125"
cranelift-frontend = "0.125"
cranelift-jit = "0.125"
cranelift-module = "0.125"
cranelift-native = "0.125"
tenon-syntax = { path = "crates/tenon-syntax" }
tenon-verify = { path = "crates/tenon-verify" }
tenon-codegen = { path = "crates/tenon-codegen" }
tenon-dist = { path = "crates/tenon-dist" }
